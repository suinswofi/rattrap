<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>TikTok Rat Trap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><img class="brand-mark" src="icon.png" alt=""><span>TikTok Rat Trap</span></div>

    <section class="side-section">
      <h3>Rooms</h3>
      <ul id="room-list" class="side-list"></ul>
      <form id="add-room" class="side-add"><input placeholder="add @streamer" autocomplete="off" spellcheck="false"><button type="submit" title="Monitor this room">+</button></form>
    </section>

    <section class="side-section">
      <h3>Blacklist <span class="for-room" id="blacklist-room"></span> <button class="hint" data-help="blacklist" title="What is the blacklist?">?</button></h3>
      <ul id="blacklist" class="side-list chips"></ul>
      <form id="add-blacklist" class="side-add"><input placeholder="add @streamer" autocomplete="off" spellcheck="false"><button type="submit">+</button></form>
    </section>

    <section class="side-section">
      <h3>Watch list <span class="for-room" id="watchlist-room"></span> <button class="hint" data-help="watch" title="What is the watch list?">?</button></h3>
      <ul id="watchlist" class="side-list chips"></ul>
      <form id="add-watch" class="side-add"><input placeholder="add @viewer" autocomplete="off" spellcheck="false"><button type="submit">+</button></form>
    </section>

    <div class="side-footer">
      <button id="btn-settings" class="btn">Settings</button>
      <button id="btn-data" class="btn" title="Open the data folder">Data folder</button>
    </div>
  </aside>

  <main id="main">
    <header id="room-header">
      <div class="room-title">
        <span id="room-name">No room</span>
        <span id="room-status" class="status"></span>
      </div>
      <div id="room-meta" class="room-meta"></div>
      <div class="room-actions">
        <button id="btn-save" class="btn primary" title="Write this stream's snapshot and update the room history">Save</button>
        <button id="btn-reconnect" class="btn">Reconnect</button>
        <button id="btn-remove" class="btn danger">Remove</button>
      </div>
    </header>

    <nav id="tabs">
      <button class="tab-btn active" data-tab="users">Users <span class="count" id="count-users"></span></button>
      <button class="tab-btn" data-tab="burners">Burners <span class="count" id="count-burners"></span></button>
      <button class="tab-btn" data-tab="blacklist">Blacklist hits <span class="count" id="count-blacklist"></span></button>
      <button class="tab-btn" data-tab="chat">Chat</button>
      <button class="tab-btn" data-tab="log">Log</button>
      <div class="tab-tools">
        <label class="stream-pick" id="stream-wrap" hidden title="Which stream to show. Every stream Rat Trap has monitored keeps its own log."><span>Stream</span><select id="stream-select"></select></label>
        <input id="search" type="search" placeholder="search username or nickname" autocomplete="off" spellcheck="false">
      </div>
    </nav>

    <section id="content">
      <div id="tab-users" class="tab">
        <div class="table-wrap"><table id="users-table"><thead></thead><tbody></tbody></table></div>
      </div>
      <div id="tab-suspects" class="tab" hidden>
        <p class="note" id="suspects-note"></p>
        <div id="suspect-tools" class="toolbar">
          <div id="suspect-filters" class="chipbar" title="Click a filter once to keep only accounts that have it, twice to keep only accounts that do not, a third time to switch it off. Filters combine: every selected filter must hold."></div>
          <div class="toolbar-right">
            <label class="check"><input type="checkbox" id="show-dismissed"> show dismissed <span id="dismissed-count" class="count"></span></label>
            <button id="btn-dismiss-all" class="btn" title="Dismiss every account on this tab except pinned ones, including any hidden by the search box or filters. They come back if they join the room again.">Dismiss all but pinned</button>
          </div>
        </div>
        <div id="suspects-list" class="cards"></div>
      </div>
      <div id="tab-chat" class="tab" hidden><div id="chat-list" class="stream"></div></div>
      <div id="tab-log" class="tab" hidden>
        <div id="log-tools" class="toolbar">
          <div id="log-kinds" class="chipbar" title="Which kinds of event to show"></div>
          <div class="toolbar-right">
            <span id="log-count" class="count"></span>
            <button class="hint" data-help="streams" title="How streams and the log work">?</button>
          </div>
        </div>
        <div id="log-list" class="stream"></div>
      </div>
      <div id="empty" class="empty" hidden>
        <img class="empty-mark" src="icon.png" alt="">
        <p>Add a streamer in the sidebar to start watching their room.</p>
      </div>
    </section>
  </main>

  <aside id="detail" hidden>
    <div class="detail-head">
      <div>
        <div id="detail-name" class="detail-name"></div>
        <div id="detail-nick" class="detail-nick"></div>
      </div>
      <button id="detail-close" class="icon-btn" title="Close">×</button>
    </div>
    <div id="detail-body" class="detail-body"></div>
  </aside>
</div>

<div id="settings" class="modal" hidden>
  <div class="dialog">
    <h2>Settings</h2>
    <form id="settings-form">
      <label>Alert at burner score <input name="burnerAlertScore" type="number" min="0" step="1"></label>
      <label>Autosave every (minutes, 0 = off) <input name="autosaveMinutes" type="number" min="0" step="1"></label>
      <label>Live check while offline (seconds) <input name="livePollSeconds" type="number" min="30" step="1"></label>
      <label>Chat messages kept per user in the stream snapshot (pinned and watched accounts keep everything) <input name="chatHistory" type="number" min="1" step="1"></label>
      <label>Forget accounts not seen for this many days (0 = keep forever; pinned and watched accounts are always kept) <input name="pruneAfterDays" type="number" min="0" step="1"></label>
      <label>Delete stream logs older than this many days (0 = keep forever; pinned and watched accounts' events are kept in the history regardless) <input name="logKeepDays" type="number" min="0" step="1"></label>
      <label>Maximum accounts in a stream's list (0 = unlimited; over the limit, the ones seen longest ago are trimmed but stay in history) <input name="maxUsers" type="number" min="0" step="100"></label>
      <label>Euler Stream API key (optional) <input name="signApiKey" type="password" autocomplete="off"></label>
      <label class="check"><input name="reconnectWhenLive" type="checkbox"> wait for offline streamers to go live</label>
      <label class="check"><input name="resume" type="checkbox"> pick the last stream back up on start</label>
      <p class="note" id="settings-path"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="settings-cancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="help" class="modal" hidden>
  <div class="dialog help">
    <div class="dialog-head"><h2 id="help-title"></h2><button id="help-close" class="icon-btn" title="Close">×</button></div>
    <div id="help-body"></div>
  </div>
</div>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
